name: Fetch portable Bforartists renderer

on:
  push:
    branches:
      - assistant/fetch-bforartists-20260805

permissions:
  contents: read

jobs:
  fetch-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download portable AppImage
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 6 --retry-delay 3 \
            -o Bforartists-5.2.0-x86_64.AppImage \
            https://github.com/Bforartists/Bforartists/releases/download/v5.2.0/Bforartists-5.2.0-x86_64.AppImage
          echo 'b8ddb706e726cfb953bfd9acdbd38f0a09498a0f79c91944f565ff3b0b20e542  Bforartists-5.2.0-x86_64.AppImage' | sha256sum -c -
          sha256sum Bforartists-5.2.0-x86_64.AppImage > Bforartists-5.2.0-x86_64.AppImage.sha256
      - name: Upload portable renderer
        uses: actions/upload-artifact@v4
        with:
          name: bforartists-5.2.0-appimage
          path: |
            Bforartists-5.2.0-x86_64.AppImage
            Bforartists-5.2.0-x86_64.AppImage.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

name: Import verified source bundle

on:
  pull_request:
    branches: [master]
    paths:
      - .github/import-manifest.json

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch manifest from pull-request branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$REPO/contents/.github/import-manifest.json?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 -d > /tmp/import-manifest.json

      - name: Reconstruct and verify archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path('/tmp/import-manifest.json').read_text())
          encoded = []
          for sha in manifest['blob_shas']:
              payload = json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['REPO']}/git/blobs/{sha}"]))
              encoded.append(base64.b64decode(payload['content']).decode('ascii'))
          archive = base64.b64decode(''.join(encoded))
          digest = hashlib.sha256(archive).hexdigest()
          if digest != manifest['sha256']:
              raise SystemExit(f"SHA-256 mismatch: {digest}")
          pathlib.Path('/tmp/falling-dice-import.tar.xz').write_bytes(archive)
          print(f"verified {len(archive):,} bytes: {digest}")
          PY

      - name: Replace repository tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name import-bundle.yml -exec rm -rf {} +
          tar -xJf /tmp/falling-dice-import.tar.xz -C .
          rm -f .github/import-manifest.json
          cp .github/workflows/import-bundle.yml /tmp/import-bundle.yml
          mkdir -p .github/workflows
          cp /tmp/import-bundle.yml .github/workflows/import-bundle.yml

      - name: Commit imported source and media
        run: |
          git config user.name "falling-dice-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import complete maintained source and media"
          git push origin HEAD:master

name: Import prepared repository bundle

on:
  push:
    branches: [master]
    paths:
      - .github/import-manifest.json
  pull_request:
    branches: [master]
    paths:
      - .github/import-manifest.json

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp .github/workflows/import-bundle.yml /tmp/import-bundle.yml
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          manifest = json.loads(pathlib.Path('.github/import-manifest.json').read_text())
          encoded_parts = []
          for blob_sha in manifest['blob_shas']:
              raw = subprocess.check_output(
                  ['gh', 'api', f"repos/{os.environ['REPO']}/git/blobs/{blob_sha}"]
              )
              payload = json.loads(raw)
              encoded_parts.append(base64.b64decode(payload['content']).decode('ascii'))

          archive = base64.b64decode(''.join(encoded_parts))
          digest = hashlib.sha256(archive).hexdigest()
          if digest != manifest['sha256']:
              raise SystemExit(f"bundle SHA-256 mismatch: {digest}")
          pathlib.Path('/tmp/falling-dice-import.tar.xz').write_bytes(archive)
          pathlib.Path('/tmp/import-options.json').write_text(json.dumps({
              'replace': bool(manifest.get('replace', False)),
              'keep_importer': bool(manifest.get('keep_importer', True)),
              'commit_message': manifest.get(
                  'commit_message',
                  'Import prepared repository bundle'
              )
          }))
          print(f"verified {len(archive):,} bytes: {digest}")
          PY

      - name: Install verified repository tree
        run: |
          REPLACE=$(python -c "import json; print('1' if json.load(open('/tmp/import-options.json'))['replace'] else '0')")
          KEEP_IMPORTER=$(python -c "import json; print('1' if json.load(open('/tmp/import-options.json'))['keep_importer'] else '0')")
          if [ "$REPLACE" = "1" ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            find .github -mindepth 1 -maxdepth 1 ! -name import-manifest.json ! -name workflows -exec rm -rf {} +
            find .github/workflows -mindepth 1 -maxdepth 1 ! -name import-bundle.yml -exec rm -rf {} +
          fi
          tar -xJf /tmp/falling-dice-import.tar.xz -C .
          rm -f .github/import-manifest.json
          if [ "$KEEP_IMPORTER" = "1" ]; then
            mkdir -p .github/workflows
            cp /tmp/import-bundle.yml .github/workflows/import-bundle.yml
          else
            rm -f .github/workflows/import-bundle.yml
          fi

      - name: Commit imported source and media
        run: |
          MESSAGE=$(python -c "import json; print(json.load(open('/tmp/import-options.json'))['commit_message'])")
          git config user.name "falling-dice-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "$MESSAGE"
          git push origin HEAD:master

name: Render automotive fidelity benchmark

on:
  push:
    branches:
      - assistant/fetch-bforartists-20260805
    paths:
      - .github/workflows/render-automotive-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-camera-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ python3 libglfw3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev

      - name: Fetch PBRT C++ renderer and CC0 BMW scene
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/mmp/pbrt-v4.git pbrt-v4
          git clone --depth 1 --filter=blob:none --sparse https://github.com/mmp/pbrt-v4-scenes.git scenes
          cd scenes
          git sparse-checkout set bmw-m6

      - name: Build PBRT CPU renderer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S pbrt-v4 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPBRT_BUILD_GPU_RENDERER=OFF
          cmake --build build --target pbrt imgtool -j2
          build/pbrt --help > pbrt_help.txt || true

      - name: Generate camera-aware studio scenes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math, re

          scene_dir = Path('scenes/bmw-m6')
          source = (scene_dir / 'bmw-m6.pbrt').read_text()
          source = re.sub(
              r'AttributeBegin\s*\n\s*Rotate 80 0 1 0\s*\n\s*Rotate -90 1 0 0\s*\n\s*LightSource "infinite"\s*\n\s*"string filename" "textures/sunflowers_equiarea\.exr"\s*\n\s*AttributeEnd',
              '', source, count=1)
          source = re.sub(r'"integer yresolution"\s*\[\s*\d+\s*\]', '"integer yresolution" [ 720 ]', source)
          source = re.sub(r'"integer xresolution"\s*\[\s*\d+\s*\]', '"integer xresolution" [ 1280 ]', source)
          source = re.sub(r'Sampler "halton"\s*\n\s*"integer pixelsamples"\s*\[\s*\d+\s*\]', 'Sampler "halton"\n    "integer pixelsamples" [ 96 ]', source)
          source = source.replace('"rgb reflectance" [ 0.7 .7 .7 ]', '"rgb reflectance" [ 0.018 0.055 0.245 ]')
          source = source.replace('"float roughness" [ 0 ]', '"float roughness" [ 0.085 ]', 1)
          source = source.replace('"rgb reflectance" [ 0.0442848 0.0442848 0.0442848 ]', '"rgb reflectance" [ 0.018 0.021 0.027 ]')
          source = source.replace('"float vroughness" [ 0.010408 ]\n    "float uroughness" [ 0.010408 ]', '"float vroughness" [ 0.22 ]\n    "float uroughness" [ 0.22 ]', 1)

          views = {
              'front_hero': ((-11.8, 0.95, 7.2), (0.0, -0.18, 0.0), 32.0),
              'rear_hero': ((11.8, 0.95, -7.2), (0.0, -0.18, 0.0), 32.0),
              'side_profile': ((0.0, 0.72, 14.5), (0.0, -0.20, 0.0), 31.5),
              'front_low': ((-11.2, -0.10, -6.8), (0.0, -0.48, 0.0), 32.5),
          }

          def add(a, b): return tuple(x + y for x, y in zip(a, b))
          def sub(a, b): return tuple(x - y for x, y in zip(a, b))
          def mul(a, s): return tuple(x * s for x in a)
          def dot(a, b): return sum(x * y for x, y in zip(a, b))
          def cross(a, b): return (a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0])
          def norm(a):
              d = math.sqrt(max(1e-20, dot(a, a)))
              return tuple(x / d for x in a)
          def points(values):
              return ' '.join(f'{v:.6f}' for p in values for v in p)
          def rect(center, u, v):
              return [sub(sub(center, u), v), add(sub(center, v), u), add(add(center, u), v), add(sub(center, u), v)]
          def area_rect(center, u, v, L):
              P = rect(center, u, v)
              return (
                  'AttributeBegin\n'
                  f'  AreaLightSource "diffuse" "rgb L" [ {L[0]} {L[1]} {L[2]} ] "bool twosided" [ true ]\n'
                  f'  Shape "trianglemesh" "integer indices" [ 0 1 2 0 2 3 ] "point3 P" [ {points(P)} ]\n'
                  'AttributeEnd\n')

          world_marker = 'WorldBegin\n'
          for name, (eye, target, fov) in views.items():
              forward3 = norm(sub(target, eye))
              forward = norm((forward3[0], 0.0, forward3[2]))
              up = (0.0, 1.0, 0.0)
              right = norm(cross(forward, up))
              backdrop_center = add(add(target, mul(forward, 8.0)), (0.0, 3.55, 0.0))
              backdrop = rect(backdrop_center, mul(right, 10.0), mul(up, 5.0))
              studio = (
                  'MakeNamedMaterial "StudioBackdrop" "string type" [ "diffuse" ] "rgb reflectance" [ 0.016 0.019 0.026 ]\n'
                  'AttributeBegin\n'
                  '  LightSource "infinite" "rgb L" [ 0.012 0.016 0.024 ]\n'
                  'AttributeEnd\n'
                  'AttributeBegin\n'
                  '  NamedMaterial "StudioBackdrop"\n'
                  f'  Shape "trianglemesh" "integer indices" [ 0 1 2 0 2 3 ] "point3 P" [ {points(backdrop)} ]\n'
                  'AttributeEnd\n')
              studio += area_rect(add(add(target, mul(right, -5.4)), add(mul(forward, -0.8), (0.0, 2.7, 0.0))), mul(forward, 2.5), mul(up, 1.65), (20, 22, 27))
              studio += area_rect(add(add(target, mul(right, 5.0)), add(mul(forward, -0.3), (0.0, 2.1, 0.0))), mul(forward, 2.1), mul(up, 1.35), (8, 9, 12))
              studio += area_rect(add(target, (0.0, 5.15, 0.0)), mul(right, 4.5), mul(forward, 3.0), (12, 13, 15))
              studio += area_rect(add(add(target, mul(forward, 4.8)), (0.0, 2.8, 0.0)), mul(right, 3.2), mul(up, 1.35), (16, 12, 9))

              text = source.replace(world_marker, world_marker + '\n' + studio, 1)
              text = re.sub(
                  r'LookAt\s+[-+0-9.eE]+\s+[-+0-9.eE]+\s+[-+0-9.eE]+\s*\n\s*[-+0-9.eE]+\s+[-+0-9.eE]+\s+[-+0-9.eE]+\s*\n\s*[-+0-9.eE]+\s+[-+0-9.eE]+\s+[-+0-9.eE]+',
                  f'LookAt {eye[0]:.6f} {eye[1]:.6f} {eye[2]:.6f}\n    {target[0]:.6f} {target[1]:.6f} {target[2]:.6f}\n    0 1 0',
                  text, count=1)
              text = re.sub(r'"float fov"\s*\[\s*[^\]]+\]', f'"float fov" [ {fov} ]', text, count=1)
              text = re.sub(r'"string filename"\s*\[\s*"[^"]+"\s*\]', f'"string filename" [ "{name}.png" ]', text, count=1)
              (scene_dir / f'{name}.pbrt').write_text(text)
          PY

      - name: Render four production-reference views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/renders artifact/scenes artifact/logs artifact/bin
          for scene in front_hero rear_hero side_profile front_low; do
            echo "Rendering $scene"
            (cd scenes/bmw-m6 && ../../build/pbrt --spp 96 "${scene}.pbrt") 2>&1 | tee "artifact/logs/${scene}.txt"
            cp "scenes/bmw-m6/${scene}.png" "artifact/renders/${scene}.png"
            cp "scenes/bmw-m6/${scene}.pbrt" "artifact/scenes/${scene}.pbrt"
          done
          cp build/pbrt build/imgtool artifact/bin/
          cp pbrt_help.txt artifact/
          cp scenes/bmw-m6/BLENDSWAP_LICENSE.txt artifact/
          printf '%s\n' \
            'Renderer: pbrt-v4, C++ CPU spectral path tracer' \
            'Geometry: BMW M6 scene from mmp/pbrt-v4-scenes, CC0' \
            'Geometry is identical in every view; only cameras and studio fixtures change.' \
            'Purpose: production-reference automotive fidelity benchmark; not an original vehicle design or manufacturing CAD.' \
            > artifact/PROVENANCE.txt
          git -C pbrt-v4 rev-parse HEAD > artifact/PBRT_COMMIT.txt
          git -C scenes rev-parse HEAD > artifact/SCENE_COMMIT.txt
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS.txt

      - name: Upload final C++ path-traced benchmark
        uses: actions/upload-artifact@v4
        with:
          name: automotive-pbrt-v4-studio-benchmark
          path: artifact
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
